<!doctype html>
<html lang="en"><head><meta charset="utf-8"><!-- EXAMPLE — All FX.filter filters applied to one test picture.
     contact sheet:  node tools/render.mjs sheet --page examples/filters.html --markers --cols 5 --tile 400
     Read the source: it is the shortest working usage of the engine. -->
<title>fx filters</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;margin:auto;max-width:100vw;max-height:100vh;position:absolute;inset:0}</style></head>
<body><canvas id="out"></canvas>
<script src="../lib/kit.js"></script><script src="../lib/post.js"></script><script src="../lib/gfx.js"></script><script src="../lib/fx.js"></script>
<script>
'use strict';
const Q = K.params(), W = Q.w || 960, H = Q.h || 540, FPS = 30, names = ['none', ...FX.filters.filter(n => n !== 'dof')], DUR = names.length;
window.VIDEO = { width: W, height: H, fps: FPS, duration: DUR, markers: names.map((n, i) => ({ t: i + .5, label: n })) };
const out = document.getElementById('out'); out.width = W; out.height = H;
const post = new Post(out), gfx = new GFX(post), fx = new FX(gfx);
const cv = K.canvas(W, H), g = cv.getContext('2d'); let base = null, rtA = null;
function drawBase() {
  const gr = g.createLinearGradient(0, 0, W, H); gr.addColorStop(0, '#ff7a3d'); gr.addColorStop(.5, '#d6247a'); gr.addColorStop(1, '#2b3cff'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  g.fillStyle = 'rgba(255,255,255,.92)'; g.beginPath(); g.arc(W * .72, H * .36, H * .2, 0, 6.283); g.fill();
  g.strokeStyle = '#fff'; g.lineWidth = 8; g.strokeRect(W * .08, H * .15, W * .28, H * .5);
  K.text(g, 'Filters', W * .3, H * .42, { size: H * .22, weight: 800, fill: '#111' }); K.text(g, 'سلام جهان', W * .5, H * .8, { size: H * .14, weight: 800, fill: '#fff' });
}
function renderFrame(t) {
  const i = Math.min(names.length - 1, Math.floor(t)); gfx.time(4 + (t - i) * 2); post.begin([0, 0, 0, 1]);
  if (!base) { drawBase(); base = gfx.up(cv); rtA = gfx.rt(W, H); }
  if (names[i] === 'none') gfx.blit(base); else fx.filter(names[i], base, {}, {});
  post.end({ frame: Math.round(t * FPS), bloom: 0, grain: 0, vignette: 0, ca: .0003 });
}
window.renderFrame = renderFrame; window.ready = K.loadFonts(['800 Vazirmatn', '800 Inter']).then(() => true);
</script></body></html>
