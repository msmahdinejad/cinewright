<!doctype html>
<html lang="fa"><head><meta charset="utf-8"><!-- EXAMPLE — Puffy 3D text in Persian/Latin (Geo.text) over a shader background, and an instanced night city with lit windows, fog and DOF.
     contact sheet:  node tools/render.mjs sheet --page examples/text3d-city.html --markers --cols 3 --tile 640
     Read the source: it is the shortest working usage of the engine. -->
<title>3d text relief + city</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;margin:auto;max-width:100vw;max-height:100vh;position:absolute;inset:0}</style></head>
<body><canvas id="out"></canvas>
<script src="../lib/kit.js"></script><script src="../lib/post.js"></script><script src="../lib/gfx.js"></script><script src="../lib/fx.js"></script><script src="../lib/scene3d.js"></script>
<script>
'use strict';
const Q = K.params(), W = Q.w || 1280, H = Q.h || 720, FPS = 30, DUR = 8;
window.VIDEO = { width: W, height: H, fps: FPS, duration: DUR, markers: [{ t: 0.5, label: 'text A' }, { t: 1.8, label: 'text B' }, { t: 3, label: 'text C' }, { t: 4.5, label: 'city' }, { t: 6, label: 'city2' }, { t: 7.5, label: 'city3' }] };
const out = document.getElementById('out'); out.width = W; out.height = H;
const post = new Post(out), gfx = new GFX(post), fx = new FX(gfx);
// ── scene A: puffy chrome Persian + Latin text
const A = new Scene3D(gfx, { W, H }); A.env = Env.studio({ colors: ['#0a0a10', '#fff2dc', '#ff3d8b', '#38d6ff'] }); A.floor({ y: -2.1, color: '#0a0a12', reflect: .5, fade: .02 }); A.fog = { color: '#08080e', density: .02 }; A.cam.fov = 30;
let meshes = [];
const B = new Scene3D(gfx, { W, H }); B.env = Env.night({ colors: ['#05060e', '#ff4fa3', '#3ad7ff', '#7b4bff'] }); B.sky = { amt: 1, rough: .1 }; B.fog = { color: '#1b1030', density: .02, hDensity: .08, hRef: 1.5 }; B.cam.fov = 42; B.cam.far = 400;
function buildCity() { const R = K.rng(7), list = []; for (let gx = -22; gx <= 22; gx++) for (let gz = -60; gz <= 8; gz++) { if (Math.abs(gx % 4) < 1) continue; const hgt = .5 + Math.pow(R(), 3) * 9 * (1 - Math.abs(gx) / 30), w = .7 + R() * .8; list.push({ pos: [gx * 1.6, hgt / 2, gz * 1.6], scale: [w, hgt, w], color: [.12 + R() * .15, .1 + R() * .12, .2 + R() * .2] }); } return list; }
B.instances(Geo.box(1, 1, 1), Mat.pbr({ base: '#ffffff', metal: .2, rough: .35, coat: .4, windows: { on: .38, size: [.3, .45], color: '#ffd9a0' } }), buildCity());
B.mesh(Geo.plane(400, 400), Mat.pbr({ base: '#15121c', rough: .5 }), { pos: [0, 0, -40], rot: [-Math.PI / 2, 0, 0] });
function renderFrame(t) {
  gfx.time(t); post.begin([0, 0, 0, 1]);
  if (t < 4) {
    if (!meshes.length) { const mk = (str, h, mat) => A.mesh(Geo.text(str, { height: h }), mat);
      meshes = [mk('سلام دنیا', 2.6, Mat.chrome()), mk('Persian + Latin', 2.2, Mat.gold()), mk('خفن ✦', 3, Mat.iridescent({ base: '#ffffff' }))]; }
    const k = Math.min(2, Math.floor(t * .75)); meshes.forEach((m, i) => { m.visible = i === k; m.rot = [Math.sin(t * .7) * .12, Math.sin(t * .9) * .5, 0]; });
    A.cam.pos = [Math.sin(t * .5) * 2, .6, 12]; A.cam.target = [0, -.2, 0]; fx.bg('nebula', { c: ['#04030c', '#3b1a8a', '#d8337a', '#ffcf80'], speed: .6 }); gfx.blit(A.render({ clear: [0, 0, 0, 0], dof: { focus: 12, range: 3, blur: 10 } }), { blend: 'alpha' });
  } else {
    const u = (t - 4) / 4; B.cam.pos = [Math.sin(u * 3) * .35, 2.4 + Math.sin(u * 5) * .5, 6 - u * 62]; B.cam.target = [Math.sin(u * 3 + .6) * 1.2, 2.6 + u * 1.5, 6 - u * 62 - 14]; gfx.blit(B.render({ dof: { focus: 18, range: 8, blur: 12 } }));
  }
  post.end({ frame: Math.round(t * FPS), bloom: .55, threshold: .75, grain: .03, vignette: .4, ca: .0015, streak: .1 });
}
window.renderFrame = renderFrame; window.ready = K.loadFonts(['800 Vazirmatn', '800 Inter']).then(() => true);
</script></body></html>
