<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<title>Avorythm — Hear every voice</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;margin:auto;max-width:100vw;max-height:100vh;position:absolute;inset:0;width:auto;height:auto}</style>
</head>
<body>
<canvas id="out"></canvas>

<!-- ONE timeline for picture AND sound (audio.mjs reads it). 120 BPM → beat 0.5 s, bar 2 s; scenes start on bar lines. click/o1–o4 are sound+picture events inside scenes. -->
<script id="cues" type="application/json">
{ "bpm": 120, "duration": 30,
  "t": { "babel": 0, "tab": 4, "click": 7.5, "prism": 8, "o1": 9.7, "o2": 9.9, "o3": 10.1, "o4": 10.3, "mix": 12, "glass": 16, "world": 20, "burst": 24, "end": 26 },
  "hits": [0.8, 4, 8, 12, 16, 20, 24, 26] }
</script>

<script src="lib/kit.js"></script><script src="lib/post.js"></script><script src="lib/gfx.js"></script><script src="lib/fx.js"></script><script src="lib/trans.js"></script>
<script src="lib/stage.js"></script><script src="lib/scene3d.js"></script><script src="lib/parts.js"></script><script src="lib/type.js"></script><script src="lib/cine.js"></script><script src="lib/ui.js"></script>
<script>
'use strict';
/* ═════════════════════════════════════════════════════════════════════════════════════════════════════════════
   AVORYTHM — "two voices, one meaning" (30 s).  Violet = the source voice (always on the LEFT, enters left→right), cyan = the target voice (always on the RIGHT, enters right→left,
   Persian RTL). The film starts in a world where sound has no meaning, one click turns the second voice on, and the two directions lock together as the logo.
   1 babel   2 tab   3 prism   4 mix   5 glass   6 world   7 burst   8 end        (see brief.md for the storyboard, brief → techniques → scenes)
   ═════════════════════════════════════════════════════════════════════════════════════════════════════════════ */
const CUES = JSON.parse(document.getElementById('cues').textContent), T = CUES.t, HITS = CUES.hits;
const Q = K.params(), W = Q.w || 1920, H = Q.h || 1080, FPS = Q.fps || 30, DUR = CUES.duration;
const u = H / 1080, minDim = Math.min(W, H * 1.35), vertical = H > W * 1.1;
const PAL = { bg: '#05061a', navy: '#0a1155', violet: '#6a2fff', cyan: '#40f5f5', white: '#f4f7ff', alarm: '#ff4d6d', gray: '#7a7f99' };
const FA = K.FONTS.fa, FAD = K.FONTS.faDisplay, LAT = K.FONTS.grotesk, SANS = K.FONTS.sans, MONO = K.FONTS.mono;
const { E, seg, clamp } = K, fa = n => K.faDigits(String(n));
window.VIDEO = { width: W, height: H, fps: FPS, duration: DUR, title: 'Avorythm — Hear every voice', audio: 'audio.wav', markers: Object.entries(T).map(([label, t]) => ({ t, label })) };

const COPY = {
  babel: ['صدا هست…', 'اما معنا نه.'], tabNo: 'ویدیو بدون زیرنویس؟', tabYes: 'یک تب. یک زبان.', prism: 'یک تب. یک زبان. چهار خروجی.',
  outs: ['صدای اصلی', 'صدای دوبله', 'زیرنویس مبدأ', 'زیرنویس ترجمه'], mix: 'اصلی و دوبله، به هر نسبتی که بخواهی.', mixL: 'اصلی', mixR: 'دوبله',
  glass: 'زیرنویس شیشه‌ای، همگام با تصویر', subs: [['The future belongs to those who listen.', 'آینده مال کسانی است که گوش می‌دهند.'], ['Every voice has a story.', 'هر صدایی داستانی دارد.']],
  world: 'هر چیزی که صدا دارد، به زبان تو.', src: ['تب مرورگر', 'صدای هر برنامه', 'فایل صوتی و تصویری'], dst: ['دوبله', 'زیرنویس', 'خروجی WAV و SRT'], pills: ['افزونهٔ Chrome', 'اپ دسکتاپ · Windows · macOS · Linux', 'کلیدهای رایگان Gemini و Groq'],
  burst: 'هر صدا را بشنو…', tagFa: 'هر صدا را بشنو — یا فقط بخوان — به زبان خودت', tagEn: 'Hear every voice — or just read it — in your language', os: 'متن‌باز · MIT', url: 'github.com/msmahdinejad/avorythm' };

/* ═══════════ engine ═══════════ */
const out = document.getElementById('out'); out.width = W; out.height = H;
const post = new Post(out), gfx = new GFX(post), fx = new FX(gfx), S = new Stage(post, gfx, { fps: FPS });
const P3 = new Scene3D(gfx, { W, H });
let MOR, EMI, DUST, LOGO, LOGO_PTS; const L2 = {};
const rgb01 = c => FX.rgb(c);

/** the real Avorythm mark (assets/avorythm-logo.png): white keyed out (K.keyWhite), the navy "A" lifted to white so the mark lives on dark backgrounds */
const makeLogo = img => K.keyWhite(img, { size: 760, lo: 175, hi: 245, recolor: (r, g, b) => { const mx = Math.max(r, g, b); if (mx >= 150 || b <= r * 1.8) return null; const k = 1 - mx / 150; return [215 + 40 * k, 226 + 29 * k, 255]; } });
const layer = id => L2[id] || (L2[id] = (() => { const cv = K.canvas(W, H), g = cv.getContext('2d'); return { cv, g, tex: null }; })());
/** draw a 2D scene into its own canvas, run an FX filter over it, put the result into rt (VHS, ASCII, mosaic … on any 2D scene) */
function filtered(id, drawFn, name, params, rt, lt, t) { const L = layer(id), g = L.g; g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.clearRect(0, 0, W, H); g.save(); drawFn(g, lt, t); g.restore(); fx.filterCanvas(L.cv, name, params, { to: rt }); }
const chip = (g, x, y, w, h, { r = h / 2, fill = 'rgba(255,255,255,.07)', stroke = 'rgba(255,255,255,.3)', glow } = {}) => { g.save(); if (glow) { g.shadowColor = glow; g.shadowBlur = 34 * u; } K.rr(g, x, y, w, h, r); g.fillStyle = fill; g.fill(); g.restore(); K.rr(g, x + .5, y + .5, w - 1, h - 1, r); g.strokeStyle = stroke; g.lineWidth = 1.6 * u; g.stroke(); };
const bez = (a, b, c, d, t) => { const m = 1 - t; return [m * m * m * a[0] + 3 * m * m * t * b[0] + 3 * m * t * t * c[0] + t * t * t * d[0], m * m * m * a[1] + 3 * m * m * t * b[1] + 3 * m * t * t * c[1] + t * t * t * d[1]]; };
const push = (g, lt, from, to, dur, cx = W / 2, cy = H / 2) => { const s = K.lerp(from, to, clamp(lt / dur)); g.translate(cx, cy); g.scale(s, s); g.translate(-cx, -cy); };
const faText = (g, str, x, y, o = {}) => K.text(g, str, x, y, { family: FA, weight: 700, ...o });

/** procedural "video": a night sky with aurora ribbons, a moon and hills. tint 0 → grey (sound without meaning), 1 → full colour */
function paintVideo(g, x, y, w, h, t, tint = 1) {
  g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip(); const sky = g.createLinearGradient(0, y, 0, y + h); sky.addColorStop(0, '#0b1240'); sky.addColorStop(.6, '#2a2c7a'); sky.addColorStop(1, '#6a2fff'); g.fillStyle = sky; g.fillRect(x, y, w, h);
  for (let k = 0; k < 3; k++) { g.beginPath(); for (let i = 0; i <= 40; i++) { const px = x + w * i / 40, py = y + h * (.34 + .08 * k + .09 * Math.sin(i * .33 + t * (.6 + k * .2) + k * 2)); i ? g.lineTo(px, py) : g.moveTo(px, py); } g.strokeStyle = ['rgba(64,245,245,.6)', 'rgba(130,90,255,.65)', 'rgba(170,205,255,.4)'][k]; g.lineWidth = h * .05; g.lineCap = 'round'; g.stroke(); }
  K.glow(g, x + w * .74, y + h * .26, h * .3, '#cfe8ff', .55); g.fillStyle = '#eaf3ff'; K.circle(g, x + w * .74, y + h * .26, h * .06); g.fill();
  [['#0a0f33', .7, .07, 1.2, 8], ['#05061a', .84, .07, 3.4, 16]].forEach(([c, y0, amp, sd, sp]) => { g.fillStyle = c; g.beginPath(); g.moveTo(x, y + h); for (let i = 0; i <= 60; i++) g.lineTo(x + w * i / 60, y + h * (y0 - amp * (.5 + .5 * K.noise1(i * .13 + sd + t * sp * .01)))); g.lineTo(x + w, y + h); g.fill(); });
  if (tint < 1) { g.globalCompositeOperation = 'saturation'; g.globalAlpha = 1 - tint; g.fillStyle = 'hsl(0,0%,50%)'; g.fillRect(x, y, w, h); }
  g.restore();
}

/* ═══════════ worlds ═══════════ */
function build() {
  // the prism: a faceted crystal (flat normals) with an iridescent surface; the neon environment gives every facet a different colour, a holo shell lights its edges
  P3.env = Env.studio({ colors: ['#080a2a', '#8aa0e8', '#6a3cff', '#2fd6e8'], amount: .95 }); P3.cam.fov = vertical ? 44 : 30; P3.light(0, { intensity: .35 }); P3.light(1, { intensity: .2 }); P3.light(2, { intensity: .1 });   // chrome + flat faces: a strong key light would turn a whole face to a white sheet
  P3.prism = P3.mesh(Geo.flat(Geo.cylinder(1.35, 1.35, 3.6, 3, true)), Mat.chrome({ base: '#dfe8ff', rough: .06, rim: '#7feaff', rimAmt: .75, rimPow: 2.6 }));
  // particles: scripts → the real logo
  const N = 60000, logoPts = LOGO_PTS, mk = (str, y) => { const p = Parts.text(str, { height: minDim * .11, n: 20000, family: SANS, weight: 700 }); return p.map(q => [q[0], q[1] + y, 0]); };
  const row1 = mk('Hello · Hola · Привет', minDim * .12), row2 = mk('مرحبا · Γειά σου · Hallo', -minDim * .12), words = [...row1, ...row2]; words.colors = words.map(q => q[0] < 0 ? [.42, .18, 1] : [.25, .96, .96]);
  MOR = new Parts.Morph(gfx, { count: N }); MOR.shapes([words, logoPts]);
  EMI = new Parts.Emitter(gfx, { count: 24000 });
  EMI.burst({ t0: T.burst, n: 8000, speed: [260 * u, 1500 * u], drag: 2.3, gravity: [0, -300 * u, 0], life: [1, 2.2], size: [1.6, 5], colors: ['#ffffff', PAL.cyan, PAL.violet], glow: .35 });
  EMI.burst({ t0: T.burst + .08, n: 5000, speed: [100 * u, 900 * u], drag: 1.7, life: [.9, 1.8], size: [1.4, 4], colors: ['#d6ceff', PAL.violet, '#2a49ff'], glow: .35, sprite: 3 });
  DUST = new Parts.Emitter(gfx, { count: 8000 });          // a foreground atmosphere over EVERY scene (drawn after the Stage, before Post): dust that drifts, glows and defocuses
  DUST.stream({ t0: 0, t1: DUR, n: 6000, spawn: { box: [W * 1.3, H * 1.2, 900] }, speed: [14 * u, 60 * u], life: [4, 8], dir: [0, 1, 0], angle: 1.4, flow: 70 * u, size: [1.2, 4.5], colors: ['#9fb4ff', '#ffffff', '#9ff7ff'], loop: true, glow: .35, drag: .3 });
}

/* ═══════════ scene drawing ═══════════ */
const WORDS = ['Hello', 'Hola', 'Привет', 'Γειά σου', 'Bonjour', 'Hallo', 'Merhaba', 'مرحبا', 'Ciao', 'Olá', 'Salut', 'Hej'];
function drawBabel(g, lt, t) {
  g.fillStyle = PAL.bg; g.fillRect(0, 0, W, H);
  const hook = seg(lt, 0, .72, E.outCubic), wall = seg(lt, .8, 1.1);
  // hook: a heartbeat line grows from the centre, a spike at the front (frame 1 already moves)
  g.save(); g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); const x0 = W * (.5 - .46 * hook), x1 = W * (.5 + .46 * hook), y0 = H / 2; g.moveTo(x0, y0);
  for (let i = 0; i <= 80; i++) { const x = K.lerp(x0, x1, i / 80), d = Math.abs((x - W / 2) / (W * .46)), spike = Math.exp(-Math.pow((x - (W / 2 + (lt * 1.1 - .55) * W * .42)) / (W * .018), 2)); g.lineTo(x, y0 - spike * H * .14 * (lt < .8 ? 1 : 0) + Math.sin(i * .5 + t * 9) * 2 * u * (1 - d)); }
  g.globalAlpha = lt < .8 ? 1 : 1 - seg(lt, .8, 1.2); K.neon(g, PAL.violet, 3 * u * 2, 1); g.restore();
  if (wall > 0) { g.save(); const s = 1.1 - .1 * E.outCubic(seg(lt, .8, 1.5)); g.translate(W / 2, H / 2); g.rotate(-.1); g.scale(s, s); g.translate(-W / 2, -H / 2); g.globalAlpha = wall;
    for (let r = -1; r < 11; r++) { const y = H * (.0 + r * .105) + H * .04, big = r % 3 === 1, str = WORDS.join('   ·   ') + '   ·   '; Type.marquee(g, str, y, t + r * 1.7, { speed: (90 + r * 16) * u * 2, dir: r % 2 ? 1 : -1, size: H * (big ? .105 : .07), weight: big ? 800 : 600, family: SANS, fill: K.rgba('#8a63ff', big ? .7 : .38), W: W * 1.6 }); } g.restore(); }
  // the dull, muffled waveform (sound without meaning)
  g.save(); g.globalAlpha = wall; K.bars(g, W * .3, H * .5, W * .4, H * .12, 44, (uu, i) => .06 + .1 * Math.abs(K.noise2(i * .4, t * 3.4)), { gap: .5, color: 'rgba(150,155,185,.55)', mirror: true }); g.restore();
  K.vignette(g, W, H, .75);
}
function babelCaption(g, lt) { if (lt < 1.2) return; const a = seg(lt, 1.2, 1.5); g.save(); g.globalAlpha = a; chip(g, W * .2, H * .32, W * .6, H * .38, { r: 36 * u, fill: 'rgba(5,6,26,.72)', stroke: 'rgba(255,255,255,.12)' }); g.restore();
  K.words(g, COPY.babel[0], W / 2, H * .44, lt - 1.35, { size: H * .12, weight: 400, family: FAD, fill: PAL.white, each: .14, dur: .6, max: W * .55 }); K.words(g, COPY.babel[1], W / 2, H * .6, lt - 2.0, { size: H * .12, weight: 400, family: FAD, fill: PAL.alarm, each: .14, dur: .6, max: W * .55 }); }

/* — 2 · tab: a foreign video without subtitles, the Avorythm popup, a cursor that picks tab + language — */
function drawTab(g, lt, t) {
  g.fillStyle = PAL.bg; g.fillRect(0, 0, W, H); K.glow(g, W * .2, H * .7, H * .8, PAL.violet, .12 + .1 * seg(lt, 2.4, 3.6)); push(g, lt, 1, 1.05, 4);
  const bx = W * .05, by = H * .17, bw = W * .58, bh = H * .7, c = UI.browser(g, bx, by, bw, bh, { url: 'lecture.example.com/watch', tabs: ['Lecture · Neural nets'], active: 0 });
  paintVideo(g, c.x, c.y, c.w, c.h, t * 2.4, .12);
  // the speaker's slide: foreign text, a flat voice-strip and the "CC off" badge
  K.text(g, 'Neural networks', c.x + c.w * .06, c.y + c.h * .2, { size: c.h * .11, weight: 800, family: SANS, fill: 'rgba(235,238,255,.85)', align: 'left' }); K.text(g, 'Les réseaux de neurones apprennent…', c.x + c.w * .06, c.y + c.h * .34, { size: c.h * .05, weight: 500, family: SANS, fill: 'rgba(235,238,255,.55)', align: 'left' });
  K.bars(g, c.x + c.w * .06, c.y + c.h * .86, c.w * .88, c.h * .07, 60, (uu, i) => .1 + .35 * Math.abs(K.noise2(i * .31, t * 6)), { gap: .5, color: 'rgba(170,175,205,.7)', mirror: true });
  const bxx = c.x + c.w * .88, byy = c.y + c.h * .16; chip(g, bxx - 56 * u, byy - 28 * u, 112 * u, 56 * u, { r: 12 * u, fill: 'rgba(5,6,26,.7)', stroke: PAL.alarm }); K.text(g, 'CC', bxx, byy, { size: 30 * u, weight: 800, family: SANS, fill: PAL.alarm }); g.strokeStyle = PAL.alarm; g.lineWidth = 4 * u; g.beginPath(); g.moveTo(bxx - 52 * u, byy + 24 * u); g.lineTo(bxx + 52 * u, byy - 24 * u); g.stroke();
  // popup (RTL panel)
  const px = W * .635, py = H * .18, pw = W * .3, ph = H * .68, e = E.outBack(seg(lt, .9, 1.5)); g.save(); g.translate(0, (1 - e) * H * .08); g.globalAlpha = clamp(e * 1.4);
  chip(g, px, py, pw, ph, { r: 28 * u, fill: 'rgba(14,16,48,.9)', stroke: 'rgba(120,130,255,.4)', glow: 'rgba(106,47,255,.45)' });
  if (LOGO) g.drawImage(LOGO, px + pw - 100 * u, py + 22 * u, 76 * u, 76 * u); K.text(g, 'Avorythm', px + 24 * u, py + 62 * u, { size: 40 * u, weight: 800, family: LAT, fill: PAL.white, align: 'left' });
  const sel = seg(lt, 1.7, 1.9), lang = seg(lt, 2.7, 2.9); faText(g, 'تب فعلی', px + pw - 28 * u, py + ph * .27, { size: 28 * u, weight: 600, fill: '#aeb4d8', align: 'right' });
  chip(g, px + 24 * u, py + ph * .31, pw - 48 * u, 70 * u, { r: 16 * u, fill: K.rgba(PAL.violet, .12 + .3 * sel), stroke: K.rgba(PAL.violet, .4 + .6 * sel) }); faText(g, 'Lecture · Neural nets', px + 44 * u, py + ph * .31 + 35 * u, { size: 27 * u, family: SANS, weight: 600, fill: PAL.white, align: 'left', dir: 'ltr' });
  faText(g, 'زبان مقصد', px + pw - 28 * u, py + ph * .52, { size: 28 * u, weight: 600, fill: '#aeb4d8', align: 'right' });
  [['English', 0], ['فارسی', 1], ['Español', 2], ['Русский', 3]].forEach(([name, i]) => { const cx = px + 24 * u + (i % 2) * (pw - 48 * u) / 2, cy = py + ph * .56 + Math.floor(i / 2) * 78 * u, cw = (pw - 48 * u) / 2 - 10 * u, hit = i === 1 ? lang : 0;
    chip(g, cx, cy, cw, 66 * u, { r: 16 * u, fill: K.rgba(PAL.cyan, .06 + .3 * hit), stroke: K.rgba(i === 1 ? PAL.cyan : '#ffffff', i === 1 ? .35 + .65 * hit : .22), glow: hit > .5 ? 'rgba(64,245,245,.5)' : null }); K.text(g, name, cx + cw / 2, cy + 33 * u, { size: 30 * u, weight: 700, family: i === 1 ? FA : SANS, fill: hit > .5 ? PAL.cyan : PAL.white }); });
  const go = seg(lt, 3.0, 3.3), press = Math.max(0, 1 - Math.abs(lt - 3.5) * 8); UI.button(g, px + 24 * u, py + ph - 104 * u, pw - 48 * u, 78 * u, 'شروع ترجمهٔ زنده', { press, hover: go, size: 30 * u, color: PAL.violet });
  g.restore();
  UI.cursor(g, lt, [[0, W * .9, H * .92], [1.0, px + pw * .5, py + ph * .38, E.inOutCubic, .1], [1.7, px + pw * .5, py + ph * .35], [2.6, px + pw * .7, py + ph * .6, E.inOutCubic, .12], [3.4, px + pw * .5, py + ph - 63 * u, E.inOutCubic, .08], [4, px + pw * .5, py + ph - 63 * u]], [1.7, 2.7, 3.5], { scale: 1.8 * u });
  K.vignette(g, W, H, .6);
}
function tabCaption(g, lt) { const a = 1 - seg(lt, 2.0, 2.3);
  if (a > 0) { g.save(); g.globalAlpha = a; K.words(g, COPY.tabNo, W * .35, H * .085, lt - .35, { size: H * .075, weight: 400, family: FAD, fill: PAL.white, each: .14, dur: .6, max: W * .6 }); g.restore(); }
  K.words(g, COPY.tabYes, W * .35, H * .085, lt - 2.3, { size: H * .075, weight: 400, family: FAD, fill: PAL.cyan, each: .14, dur: .6, max: W * .6 }); }

/* — 3 · prism: beams are drawn BEHIND the 3D crystal (2D layer → rt), labels in front — */
function drawBeams(g, lt, t, c0, c1) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W, H); g.globalCompositeOperation = 'lighter'; g.lineCap = 'round';
  const inP = E.outCubic(seg(lt, .15, .9)), wave = (x, a) => Math.sin(x * .02 + t * 12) * a * (1 - Math.min(1, x / (W * .5)) * .6);
  g.beginPath(); for (let x = -20; x <= c0[0] * inP; x += 8) { const y = c0[1] + wave(x, 22 * u); x === -20 ? g.moveTo(x, y) : g.lineTo(x, y); } for (const [w, a] of [[26, .08], [12, .2], [5, .9]]) { g.lineWidth = w * u; g.strokeStyle = `rgba(235,240,255,${a})`; g.stroke(); }
  for (let k = 0; k < 4; k++) { const x = ((t * 520 * u + k * c0[0] / 4) % c0[0]) * inP; K.glow(g, x, c0[1] + wave(x, 22 * u), 46 * u, '#ffffff', .75); }
  const cols = [PAL.violet, PAL.cyan, '#a58bff', '#9ff7ff'], ys = [.2, .4, .6, .8], targets = ys.map(v => [W * .79, H * v]);
  targets.forEach((tg, i) => { const q = E.outCubic(seg(lt, 1.05 + i * .4 * .5, 1.9 + i * .2)); if (q <= 0) return; const a = c1, b = [a[0] + (tg[0] - a[0]) * .35, a[1]], c = [tg[0] - (tg[0] - a[0]) * .3, tg[1]];
    g.beginPath(); for (let k = 0; k <= 36 * q; k++) { const [x, y] = bez(a, b, c, tg, k / 36); k ? g.lineTo(x, y) : g.moveTo(x, y); } for (const [w, al] of [[22, .08], [9, .22], [3.5, 1]]) { g.lineWidth = w * u; g.strokeStyle = K.rgba(cols[i], al); g.stroke(); }
    const [hx, hy] = bez(a, b, c, tg, q); K.glow(g, hx, hy, 40 * u, cols[i], .9); if (q >= 1) for (let k = 0; k < 3; k++) { const w = (t * .8 + k / 3 + i * .17) % 1, [px, py] = bez(a, b, c, tg, w); K.glow(g, px, py, 30 * u, cols[i], .85); } });
  return targets;
}
function drawPrismLabels(g, lt, targets) { const cols = [PAL.violet, PAL.cyan, '#a58bff', '#9ff7ff'];
  targets.forEach(([x, y], i) => { const q = E.outBack(seg(lt, 1.7 + i * .2, 2.3 + i * .2)); if (q <= 0) return; g.save(); g.globalAlpha = clamp(q * 1.6); g.translate((1 - q) * -60 * u, 0); const w = W * .17, h = H * .095, c = i % 2 ? PAL.cyan : PAL.violet;
    chip(g, x, y - h / 2, w, h, { r: 22 * u, fill: 'rgba(8,10,40,.78)', stroke: K.rgba(c, .85), glow: K.rgba(c, .5) }); faText(g, COPY.outs[i], x + w / 2, y, { size: H * .034, fill: PAL.white, weight: 700, max: w * .86 }); g.restore(); }); }

/* — 4 · mix: the crossfader (violet original ↔ cyan dub), mirrored bars, percentages — */

  g.fillStyle = PAL.bg; g.fillRect(0, 0, W, H); const p = Cine.track(lt, [[0, .12], [.5, .12], [2.1, .9], [3.0, .9], [3.9, .5]]); K.glow(g, W * .12, H * .55, H * .9, PAL.violet, .3 * (1 - p * .6)); K.glow(g, W * .88, H * .55, H * .9, PAL.cyan, .3 * (.4 + p * .6)); push(g, lt, 1.0, 1.04, 4);
  const n = 64, x0 = W * .09, wAll = W * .82, hMax = H * .3, cy = H * .5; g.save(); g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) { const uu = i / (n - 1), x = x0 + wAll * uu, ao = .2 + .8 * Math.abs(K.noise2(i * .29, t * 2.6)), ad = .2 + .8 * Math.abs(K.noise2(i * .27 + 40, t * 3.1)), ho = ao * (1 - p) * hMax, hd = ad * p * hMax, bw = wAll / n * .56;
    g.fillStyle = K.rgba(PAL.violet, .95); K.rr(g, x - bw / 2, cy - ho, bw, ho * 2, bw / 2); g.fill(); g.fillStyle = K.rgba(PAL.cyan, .95); K.rr(g, x - bw / 2, cy - hd, bw, hd * 2, bw / 2); g.fill(); } g.restore();
  const ty = H * .78, tx = W * .2, tw = W * .6; UI.slider(g, tx, ty, tw, p, { h: 10 * u, color: K.mix(PAL.violet, PAL.cyan, p) }); K.glow(g, tx + tw * p, ty, 70 * u, K.mix(PAL.violet, PAL.cyan, p), .8);
  faText(g, COPY.mixL, tx - 30 * u, ty, { size: H * .042, fill: PAL.violet, align: 'right' }); faText(g, COPY.mixR, tx + tw + 30 * u, ty, { size: H * .042, fill: PAL.cyan, align: 'left' });
  Type.counter(g, Math.round(100 * (1 - p)), tx + tw * .22, ty + H * .09, { size: H * .075, weight: 800, family: FA, fa: true, fill: PAL.violet, sep: false }); Type.counter(g, Math.round(100 * p), tx + tw * .78, ty + H * .09, { size: H * .075, weight: 800, family: FA, fa: true, fill: PAL.cyan, sep: false });

/* — 5 · glass: a synchronized player and the frosted-glass subtitle card that moves and grows — */

/* — 6 · world: three sources → hub → three outputs, with pulses travelling along the links — */

    if (q >= 1) for (let p = 0; p < 2; p++) { const ph = (t * .9 + k * .21 + p * .5) % 1; K.trail(g, tt => { const w = (((tt * .9 + k * .21 + p * .5) % 1) + 1) % 1; return bez(L.a, L.b, L.c, L.d, w); }, t, { span: .3, n: 14, width: 7 * u, color: L.col }); const [x, y] = bez(L.a, L.b, L.c, L.d, ph); K.glow(g, x, y, 34 * u, L.col, .95); } });
  // hub: glass disc with the real mark and concentric arcs pulsing outward (the logo's sound waves)
  const hp = E.outBack(seg(lt, .0, .7)); for (let k = 0; k < 3; k++) { const ph2 = (t * .9 + k * .33) % 1, rr = H * (.13 + k * .05) + ph2 * H * .05; g.strokeStyle = K.rgba(k % 2 ? PAL.cyan : PAL.violet, .3 * (1 - ph2)); g.lineWidth = 3 * u; g.beginPath(); g.arc(hub[0], hub[1], rr * hp, 0, K.TAU); g.stroke(); }
  g.save(); K.glow(g, hub[0], hub[1], H * .26, '#7d6bff', .5 * hp); g.beginPath(); g.arc(hub[0], hub[1], H * .12 * hp, 0, K.TAU); g.fillStyle = 'rgba(8,10,44,.9)'; g.fill(); g.strokeStyle = 'rgba(160,170,255,.55)'; g.lineWidth = 2 * u; g.stroke(); g.restore(); if (LOGO) { const s = H * .19 * hp; g.drawImage(LOGO, hub[0] - s / 2, hub[1] - s / 2, s, s); }
  // nodes
  ys.forEach((y, i) => { [[lx, COPY.src[i], icons[i], PAL.violet, 0], [rx, COPY.dst[i], icons2[i], PAL.cyan, .6]].forEach(([x, label, icon, col, d]) => { const q = E.outBack(seg(lt, .1 + i * .13 + d, .7 + i * .13 + d)); if (q <= 0) return; g.save(); g.globalAlpha = clamp(q * 1.5); g.translate((x < W / 2 ? -1 : 1) * (1 - q) * 70 * u, 0); chip(g, x, y - ch / 2, cw, ch, { r: 24 * u, fill: 'rgba(8,10,40,.78)', stroke: K.rgba(col, .85), glow: K.rgba(col, .4) }); UI.icon(g, icon, x + (x < W / 2 ? 58 * u : cw - 58 * u), y, 22 * u, col); faText(g, label, x + (x < W / 2 ? cw * .6 : cw * .44), y, { size: H * .031, fill: PAL.white, weight: 700, max: cw * .56 }); g.restore(); }); });
  // platform pills (facts): Chrome extension · desktop app OS list · free API keys
  COPY.pills.forEach((txt, i) => { const q = seg(lt, 1.9 + i * .18, 2.5 + i * .18), cx = W * [.2, .5, .8][i]; if (q <= 0) return; g.save(); g.globalAlpha = q; const w = W * [.26, .36, .3][i]; chip(g, cx - w / 2, H * .905 - 34 * u, w, 68 * u, { r: 34 * u, fill: 'rgba(8,10,40,.7)', stroke: K.rgba(i === 1 ? PAL.violet : PAL.cyan, .6) }); faText(g, txt, cx, H * .905, { size: H * .027, weight: 600, fill: PAL.white, max: w * .88 }); g.restore(); });
  K.vignette(g, W, H, .5);
}
function worldCaption(g, lt) { K.words(g, COPY.world, W / 2, H * .105, lt - .1, { size: H * .075, weight: 400, family: FAD, fill: PAL.white, each: .12, dur: .6, max: W * .86 }); }

/* — 8 · end: the mark, the name, the tagline in both directions, the facts, a long hold — */
function drawEnd(g, lt, t) {
  g.fillStyle = PAL.bg; g.fillRect(0, 0, W, H); const gr = g.createRadialGradient(W * .5, H * .4, 0, W * .5, H * .4, H * .9); gr.addColorStop(0, 'rgba(40,30,120,.55)'); gr.addColorStop(1, 'rgba(5,6,26,0)'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  K.glow(g, W * .3, H * .4, H * .7, PAL.violet, .2); K.glow(g, W * .7, H * .4, H * .7, PAL.cyan, .2); const e = E.outBack(seg(lt, 0, .9)), cx = W / 2, cy = H * .34, ls = H * .44 * e;
  for (let k = 0; k < 4; k++) { const ph = (t * .7 + k * .25) % 1, rr = H * (.2 + ph * .35); g.strokeStyle = K.rgba(k % 2 ? PAL.cyan : PAL.violet, .3 * (1 - ph) * seg(lt, .4, 1)); g.lineWidth = 3 * u; g.beginPath(); g.arc(cx, cy, rr, 0, K.TAU); g.stroke(); }
  if (LOGO) { g.save(); g.shadowColor = 'rgba(120,110,255,.7)'; g.shadowBlur = 50 * u; g.drawImage(LOGO, cx - ls / 2, cy - ls / 2 + Math.sin(t * 1.3) * 4 * u, ls, ls); g.restore(); }
  g.save(); g.globalCompositeOperation = 'lighter'; { const sw = ((t * .45) % 1) * 1.6 - .3, sx = W * sw, sg = g.createLinearGradient(sx - W * .12, 0, sx + W * .12, 0); sg.addColorStop(0, 'rgba(180,170,255,0)'); sg.addColorStop(.5, 'rgba(200,215,255,.16)'); sg.addColorStop(1, 'rgba(180,170,255,0)'); g.fillStyle = sg; g.save(); g.translate(sx, H / 2); g.rotate(.35); g.translate(-sx, -H / 2); g.fillRect(sx - W * .12, -H * .2, W * .24, H * 1.4); g.restore(); } g.restore();
  K.text(g, 'Avorythm', cx, H * .61, { size: H * .12, weight: 700, family: LAT, fill: PAL.white, alpha: seg(lt, .5, 1.2), glow: { color: 'rgba(120,110,255,.8)', blur: 30 * u } });
  K.words(g, COPY.tagFa, cx, H * .725, lt - 1.0, { size: H * .054, weight: 700, family: FA, fill: PAL.cyan, each: .12, dur: .6, max: W * .8 }); K.words(g, COPY.tagEn, cx, H * .795, lt - 1.2, { size: H * .034, weight: 500, family: LAT, fill: '#c9bcff', each: .07, dur: .5, max: W * .8, dir: 'ltr' });
  const a = seg(lt, 2.0, 2.6); g.save(); g.globalAlpha = a; faText(g, COPY.os, cx, H * .87, { size: H * .03, fill: PAL.white, weight: 600 }); K.text(g, COPY.url, cx, H * .91, { size: H * .026, family: MONO, weight: 500, fill: PAL.gray, dir: 'ltr' }); g.restore();
}

/* ═══════════ scenes ═══════════ */
S.timeline([
  { id: 'babel', at: T.babel, look: { bloom: .35, threshold: .75, grain: .07, ca: .004, vignette: .55, sat: .75 },
    gl: ({ rt }, lt, t) => filtered('babel', drawBabel, 'vhs', { amt: 1.15 - .5 * seg(lt, 2.5, 3.8) }, rt, lt, t), draw: (g, lt) => babelCaption(g, lt) },
  { id: 'tab', at: T.tab, enter: ['glitch', .4, { par: [.4, 1, 0, 3] }], look: { bloom: .4, threshold: .75, grain: .06, ca: .003, vignette: .5, sat: .8 },
    gl: ({ rt }, lt, t) => { const L = layer('tab'), g = L.g; g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.save(); drawTab(g, lt, t); g.restore(); L.tex = gfx.up(L.cv, L.tex); gfx.blit(L.tex, { to: rt }); }, draw: (g, lt) => tabCaption(g, lt) },
  { id: 'prism', at: T.prism, enter: ['flash', .3, { color: [.8, .85, 1] }], look: { bloom: .38, threshold: .92, knee: .3, streak: .06, grain: .04, ca: .003, vignette: .4 },
    gl: ({ rt }, lt, t) => { fx.bg('aurora', { c: ['#03041a', PAL.violet, PAL.cyan, '#8d6bff'], speed: 1.2, amt: .85 }, { to: rt });
      const pop = E.outBack(seg(lt, 0, .7)) * (vertical ? .5 : .66); P3.prism.scale = [pop, pop, pop]; P3.prism.rot = [Math.PI / 2 - .38 + .1 * Math.sin(lt * 1.3), .55 + .3 * Math.sin(lt * 1.1), .28 * lt]; P3.prism.pos = [0, 0, 0];
      P3.cam.pos = [Math.sin(lt * .9) * 2.2, .35 + .25 * Math.sin(lt * .7), (vertical ? 12 : 8.8) + 1.6 * (1 - seg(lt, 0, 4, E.inOutCubic))]; P3.cam.target = [0, 0, 0]; const c0 = P3.toScreen([-.42, 0, 0]), c1 = P3.toScreen([.46, 0, 0]);
      const L = layer('beams'); L.targets = drawBeams(L.g, lt, t, c0, c1); L.tex = gfx.up(L.cv, L.tex); gfx.blit(L.tex, { to: rt, blend: 'alpha' }); gfx.blit(P3.render({ clear: [0, 0, 0, 0], dof: { focus: 8.8, range: 4, blur: 6 } }), { to: rt, blend: 'alpha' }); },

  { id: 'mix', at: T.mix, enter: ['whip', .35, { dir: [-1, 0] }], bg: null, look: { bloom: .8, threshold: .6, grain: .04, ca: .003, vignette: .4 }, draw: (g, lt, t) => { drawMix(g, lt, t); mixCaption(g, lt); } },
  { id: 'glass', at: T.glass, enter: ['iris', .6, { center: [.5, .62], color: [.6, .55, 1] }], bg: null, look: { bloom: .55, threshold: .7, grain: .035, ca: .002, vignette: .4 }, draw: (g, lt, t) => { drawGlass(g, lt, t); glassCaption(g, lt); } },
  { id: 'world', at: T.world, enter: ['zoom', .5], bg: null, look: { bloom: .85, threshold: .6, grain: .035, ca: .003, vignette: .4 }, draw: (g, lt, t) => { drawWorld(g, lt, t); worldCaption(g, lt); } },
  { id: 'burst', at: T.burst, enter: ['zoomBlurCut', .45], look: { bloom: .65, threshold: .72, knee: .5, streak: .15, grain: .04, ca: .004 },
    gl: ({ rt }, lt, t) => { fx.bg('gradient', { c: ['#02020c', '#0a0a2e', '#1a1060', '#02020c'], speed: .4, amt: .5 }, { to: rt });
      MOR.draw({ progress: E.inOutCubic(seg(lt, .15, 1.45)), t, flow: 300 * u, size: 1.0 * u, glow: .12, spread: .5, cam: { yaw: .16 * Math.sin(lt * 1.3), pitch: .05, dist: 1500 } }, { to: rt }); EMI.draw({ t, cam: {} }, { to: rt }); },

  { id: 'end', at: T.end, enter: ['blur', .9], bg: null, look: { bloom: .7, threshold: .66, streak: .1, grain: .035, vignette: .4 }, draw: (g, lt, t) => drawEnd(g, lt, t) },
]);
const camKeys = []; const move = (a, b, z0, z1, x0 = 0, x1 = 0, y0 = 0, y1 = 0, r0 = 0, r1 = 0) => camKeys.push({ t: a + .001, zoom: z0, x: x0, y: y0, rot: r0 }, { t: b - .001, zoom: z1, x: x1, y: y1, rot: r1 });
move(0, 4, 1.0, 1.07, 0, .004, 0, -.004); move(4, 8, 1.0, 1.085, -.007, .007, .004, -.004, -.005, .005); move(8, 12, 1.05, 1.0, -.014, .014, 0, .004, .007, -.007); move(12, 16, 1.0, 1.06, .008, -.008, -.004, .004, .004, -.004);
move(16, 20, 1.0, 1.075, 0, .007, .006, -.006); move(20, 24, 1.1, 1.0, .007, -.007, 0, 0, -.007, .007); move(24, 26, 1.0, 1.04); move(26, 30, 1.0, 1.05, 0, 0, .004, -.004);
const baseCam = Cine.path(camKeys, { ease: 'inOutSine' });
S.camera = t => Cine.mix(baseCam(t), Cine.punch(t, HITS, { amp: .016, decay: .22 }), Cine.shake(t, HITS, { amp: .007 }), Cine.handheld(t, { amp: .0035, roll: .004 }));
S.look((t, base) => { const fadeIn = 1 - seg(t, 0, .5), fadeOut = seg(t, DUR - .9, DUR - .03, E.inCubic), p = K.pulse(t, HITS, .1), shock = []; for (const h of [T.prism, T.burst]) if (t >= h && t < h + .9) shock.push([.5, .5, (t - h) * 1.1, Math.exp(-(t - h) * 3.2) * .6]);
  return { ca: (base.ca ?? .002) + .004 * p, fade: Math.max(fadeIn, fadeOut), shock, flash: [.04 * p, .04 * p, .05 * p] }; });

function renderFrame(t) { const look = S.render(t, false); DUST.draw({ t, dof: { amount: 1, focus: 0 } }, {}); post.end(look); }
