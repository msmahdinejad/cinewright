<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;margin:auto;max-width:100vw;max-height:100vh;position:absolute;inset:0}</style>
</head>
<body>
<canvas id="out"></canvas>

<!-- One timeline for picture AND sound (audio.mjs reads this). Times in seconds. -->
<script id="cues" type="application/json">
{ "bpm": 90, "duration": {{DUR}},
  "t": { "cloud": 0, "formA": 1.0, "formB": 4.6, "formC": 8.2, "outro": 11.0 },
  "hits": [1.0, 4.6, 8.2] }
</script>

<script src="lib/kit.js"></script>
<script src="lib/post.js"></script>
<script>
'use strict';
/* GPU particle morph: ~70k particles whose positions are a PURE FUNCTION of (per-particle attributes, t), evaluated in the vertex shader.
   cloud → word A → word B → mark. Curl-noise smoke during transitions, per-particle motion blur (180° shutter), depth-of-field bokeh,
   HDR additive blending, bloom + grain in post.js. Change SHAPES / colours / timing at the top; the shaders need no edits. */

/* ═══════════ 0. CONFIG ═══════════ */
const CUES = JSON.parse(document.getElementById('cues').textContent);
const Q = K.params();
const W = Q.w || {{W}}, H = Q.h || {{H}}, FPS = Q.fps || {{FPS}}, DUR = CUES.duration, LANG = Q.q.get('lang') || '{{LANG}}';
const N = +(Q.q.get('n') || 70000);
const SHAPES = LANG === 'fa'
  ? [{ text: 'سلام', dir: -1 }, { text: 'hello', dir: 1 }, { mark: true }]           // dir: which way the shape "writes" (Persian right→left)
  : [{ text: 'hello', dir: 1 }, { text: 'سلام', dir: -1 }, { mark: true }];
const CAPTION = LANG === 'fa' ? 'هر صدایی، به زبان خودت' : 'every voice, in your language';
const COL_A = [0.26, 0.10, 1.0], COL_B = [0.10, 0.92, 0.95];                           // linear-ish RGB 0..1 (violet → cyan)
window.VIDEO = { width: W, height: H, fps: FPS, duration: DUR, title: '{{TITLE}}', audio: 'audio.wav',
                 markers: Object.entries(CUES.t).map(([label, t]) => ({ t, label })) };

/* ═══════════ 1. TARGETS: sample text / shapes into per-particle destinations ═══════════ */
const { E, seg } = K, L = K.layout(W, H), u = L.u;
const out = document.getElementById('out'); out.width = W; out.height = H;
const post = new Post(out), gl = post.gl;
const cap = K.canvas(W, H), cg = cap.getContext('2d');                                  // 2D overlay for the caption
const R = K.rng(20260930);

function fitPoints(pts, w, h) {                                                          // scale a point cloud (centred) to fit w×h, flip y so up is +y
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9; for (const [x, y] of pts) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  const s = Math.min(w / (x1 - x0), h / (y1 - y0)), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2; return pts.map(([x, y]) => [(x - cx) * s, -(y - cy) * s]);
}
function pick(pts, dir) {                                                                // N destinations (with repeats), sorted along the writing direction so neighbours stay neighbours
  const a = Array.from({ length: N }, () => pts[Math.floor(R() * pts.length)]); a.sort((p, q) => dir * (p[0] - q[0]) || p[1] - q[1]); return a;
}
function markPoints() {                                                                  // concentric rings + core, a stand-in for your logo (swap for K.samplePoints of an image)
  const pts = [], radii = [.5, .78, 1.0].map(r => r * Math.min(W, H) * .2); radii.forEach((r, k) => { const n = 900 + k * 500; for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, j = (R() - .5) * 6; pts.push([Math.cos(a) * (r + j), Math.sin(a) * (r + j)]); } });
  for (let i = 0; i < 700; i++) { const a = R() * 6.283, r = Math.sqrt(R()) * Math.min(W, H) * .06; pts.push([Math.cos(a) * r, Math.sin(a) * r]); } return pts;
}
function build() {
  const cloud = Array.from({ length: N }, () => { const a = R() * 6.283, r = Math.sqrt(R()) ; return [Math.cos(a) * r * W * .55, Math.sin(a) * r * H * .45]; }).sort((p, q) => p[0] - q[0]);
  const fitW = W * (L.vertical ? .84 : .62), fitH = H * (L.vertical ? .2 : .3);
  const dest = SHAPES.map(s => s.mark ? pick(markPoints(), 1) : pick(fitPoints(K.sampleText(s.text, { size: 260, weight: 800, w: 1800, h: 640, step: 2 }), fitW, fitH), s.dir));
  const attrs = new Float32Array(N * 12), rank = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const o = i * 12;
    attrs.set([cloud[i][0], cloud[i][1], dest[0][i][0], dest[0][i][1]], o); attrs.set([dest[1][i][0], dest[1][i][1], dest[2][i][0], dest[2][i][1]], o + 4);
    attrs.set([i / N * .85 + R() * .15, .6 + R() * .9, R(), R() * 2 - 1], o + 8);         // lag (= rank along the writing direction), size, hue mix, depth
  }
  return attrs;
}

/* ═══════════ 2. SHADERS ═══════════ */
const VS = `#version 300 es
precision highp float;
layout(location=0) in vec2 aCorner; layout(location=1) in vec4 aS0; layout(location=2) in vec4 aS1; layout(location=3) in vec4 aR;
uniform vec2 uRes; uniform float uT, uShutter, uFlow, uPulse, uBase, uSpread; uniform vec3 uM; uniform vec2 uCam; uniform vec3 uColA, uColB;
out vec2 vLocal; out float vLen; out float vRad; out vec3 vCol;
const float PI = 3.14159265;
float h13(vec3 p){ p = fract(p * .1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
float vn(vec3 p){ vec3 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  return mix(mix(mix(h13(i), h13(i + vec3(1,0,0)), f.x), mix(h13(i + vec3(0,1,0)), h13(i + vec3(1,1,0)), f.x), f.y), mix(mix(h13(i + vec3(0,0,1)), h13(i + vec3(1,0,1)), f.x), mix(h13(i + vec3(0,1,1)), h13(i + vec3(1,1,1)), f.x), f.y), f.z) * 2. - 1.; }
vec2 curl(vec2 p, float t){ float e = .05; return vec2(vn(vec3(p.x, p.y + e, t)) - vn(vec3(p.x, p.y - e, t)), -(vn(vec3(p.x + e, p.y, t)) - vn(vec3(p.x - e, p.y, t)))) / (2. * e); }
float ease(float x){ x = clamp(x, 0., 1.); return x * x * x * (x * (x * 6. - 15.) + 10.); }
float stag(float m){ return ease((m - aR.x * uSpread) / (1. - uSpread)); }        // per-particle delayed progress (aR.x = lag along the writing direction)
vec3 pos(float t){
  vec2 p = aS0.xy + 70. * curl(aS0.xy * .0025, t * .22);                            // living cloud
  float e1 = stag(uM.x), e2 = stag(uM.y), e3 = stag(uM.z);
  p = mix(p, aS0.zw, e1) + curl(p * .004 + 1.3, t * .6) * sin(PI * e1) * uFlow;      // → word A, smoke while moving
  p = mix(p, aS1.xy, e2) + curl(p * .004 + 2.7, t * .6) * sin(PI * e2) * uFlow;      // → word B
  p = mix(p, aS1.zw, e3) + curl(p * .004 + 4.1, t * .6) * sin(PI * e3) * uFlow;      // → mark
  float rest = min(1., e1 * (1. - e2) + e2 * (1. - e3) + e3);
  p += (1. - .7 * rest) * 2. * vec2(sin(t * 2.3 + aR.z * 40.), cos(t * 1.9 + aR.x * 30.));   // shimmer
  float z = aR.w * 300. * (1. - .85 * rest) + 40. * sin(t * .8 + aR.x * 9.);
  return vec3(p, z);
}
vec3 project(vec3 p){
  float cy = cos(uCam.x), sy = sin(uCam.x), cp = cos(uCam.y), sp = sin(uCam.y);
  vec3 q = vec3(cy * p.x + sy * p.z, p.y, -sy * p.x + cy * p.z); q = vec3(q.x, cp * q.y - sp * q.z, sp * q.y + cp * q.z);
  float s = 1500. / (1500. + q.z); return vec3(q.xy * s, s);
}
void main(){
  vec3 a = pos(uT - uShutter * .5), b = pos(uT + uShutter * .5), qa = project(a), qb = project(b);
  vec2 d = qb.xy - qa.xy; float len = length(d); if (len > 260.) { qa = qb; d = vec2(0.); len = 0.; }
  vec2 dir = len > .01 ? d / len : vec2(1., 0.), nrm = vec2(-dir.y, dir.x);
  float sc = qb.z, base = 1.7 * aR.y * sc * uRes.y / 1080., coc = abs(.5 * (a.z + b.z)) * .02 * sc, rad = clamp(sqrt(base * base + coc * coc), .9, 40.);
  float energy = (base * base) / (rad * rad) / (1. + len * 1.1 / rad), ext = rad * 1.3;
  float along = aCorner.x < 0. ? -ext : len + ext, across = aCorner.y * ext;
  vec2 pix = qa.xy + dir * along + nrm * across;
  vLocal = vec2(along, across); vLen = len; vRad = rad;
  float e1 = stag(uM.x), e2 = stag(uM.y), e3 = stag(uM.z), rest = min(1., e1 * (1. - e2) + e2 * (1. - e3) + e3);
  float hue = mix(aR.z, clamp(.5 + qb.x / uRes.x * 1.3, 0., 1.), .7);                // colour follows screen position: violet on the left, cyan on the right
  vCol = mix(uColA, uColB, smoothstep(.15, .85, hue)) * (uBase + uPulse * .8) * energy * (1. + len * .015) * (1. + 2.4 * (1. - rest));   // dispersed dust glows brighter so it reads
  gl_Position = vec4(pix / (uRes * .5), 0., 1.);
}`;
const FS = `#version 300 es
precision highp float; in vec2 vLocal; in float vLen; in float vRad; in vec3 vCol; out vec4 o;
void main(){ vec2 d = vLocal - vec2(clamp(vLocal.x, 0., vLen), 0.); float r = length(d) / vRad; o = vec4(vCol * exp(-2.2 * r * r), 1.); }`;
const BG_VS = `#version 300 es
void main(){ gl_Position = vec4(gl_VertexID == 1 ? 3. : -1., gl_VertexID == 2 ? 3. : -1., 0., 1.); }`;
const BG_FS = `#version 300 es
precision highp float; uniform vec2 uRes; uniform float uT, uPulse; out vec4 o;
float h(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
void main(){ vec2 uv = gl_FragCoord.xy / uRes, c = uv - .5; float v = 1. - dot(c * vec2(uRes.x / uRes.y, 1.), c * vec2(uRes.x / uRes.y, 1.)) * 1.6;
  vec3 col = mix(vec3(.004, .005, .016), vec3(.018, .014, .05), clamp(v, 0., 1.)) + vec3(.02, .01, .05) * uPulse * exp(-length(c) * 3.);
  o = vec4(col, 1.); }`;

function compile(vs, fs) {
  const mk = (t, s) => { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x) || 'shader compile failed with an empty log — the WebGL context was lost (GPU process crashed?). Re-render with --gpu off'); return x; };
  const p = gl.createProgram(); gl.attachShader(p, mk(gl.VERTEX_SHADER, vs)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p) || 'shader link failed with an empty log — the WebGL context was lost (GPU process crashed?). Re-render with --gpu off');
  const uni = {}; for (let i = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); i--;) { const n = gl.getActiveUniform(p, i).name; uni[n] = gl.getUniformLocation(p, n); } return { p, u: uni };
}
const P = { pt: compile(VS, FS), bg: compile(BG_VS, BG_FS) };
const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
let ready = false;
function upload(attrs) {
  gl.bindVertexArray(vao); gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, attrs, gl.STATIC_DRAW);
  for (let i = 0; i < 3; i++) { gl.enableVertexAttribArray(1 + i); gl.vertexAttribPointer(1 + i, 4, gl.FLOAT, false, 48, 16 * i); gl.vertexAttribDivisor(1 + i, 1); }
  gl.bindVertexArray(null); ready = true;
}
const bgVao = gl.createVertexArray();

/* ═══════════ 3. FRAME ═══════════ */
const T = CUES.t, HITS = CUES.hits, SHUTTER = 1 / (2 * FPS);                            // 180° shutter
const morph = t => [seg(t, T.formA, T.formA + 2.4, E.lin), seg(t, T.formB, T.formB + 2.4, E.lin), seg(t, T.formC, T.formC + 2.4, E.lin)];
function renderFrame(t) {
  const pulse = K.pulse(t, HITS, .16), m = morph(t), fade = seg(t, T.outro, DUR - .05, E.inCubic);
  post.begin();
  gl.disable(gl.BLEND); gl.useProgram(P.bg.p); gl.bindVertexArray(bgVao); gl.uniform2f(P.bg.u.uRes, W, H); gl.uniform1f(P.bg.u.uT, t); gl.uniform1f(P.bg.u.uPulse, pulse); gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE); gl.useProgram(P.pt.p); gl.bindVertexArray(vao);
  const U = P.pt.u; gl.uniform2f(U.uRes, W, H); gl.uniform1f(U.uT, t); gl.uniform1f(U.uShutter, SHUTTER); gl.uniform1f(U.uFlow, 260); gl.uniform1f(U.uSpread, .5);
  gl.uniform1f(U.uPulse, pulse); gl.uniform1f(U.uBase, .13); gl.uniform3f(U.uM, m[0], m[1], m[2]); gl.uniform3fv(U.uColA, COL_A); gl.uniform3fv(U.uColB, COL_B);
  gl.uniform2f(U.uCam, .28 * Math.sin(t * .35), .1 * Math.sin(t * .27 + 1));
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, N); gl.disable(gl.BLEND); gl.bindVertexArray(null);
  // caption (2D overlay, blended over the HDR frame so it blooms too)
  const ca = seg(t, T.formC + 1.4, T.formC + 2.4, E.outCubic); cg.clearRect(0, 0, W, H);
  if (ca > 0) K.text(cg, CAPTION, W / 2, H * (L.vertical ? .72 : .78) + (1 - ca) * 20 * u, { size: 46 * u, weight: 500, fill: 'rgba(225,225,255,.95)', alpha: ca, max: W * .8 });
  post.overlay(cap, 1);
  post.end({ frame: K.frameIndex(t, FPS), bloom: .9, threshold: .5, knee: .5, streak: .2, ca: .002 + .006 * pulse, grain: .04, vignette: .45, fade, exposure: 1 + .1 * pulse });
}
window.renderFrame = renderFrame;
window.ready = K.loadFonts(['800 Inter', '800 Vazirmatn', '500 Inter', '500 Vazirmatn']).then(() => { upload(build()); return true; });
K.play(renderFrame, { dur: DUR, fps: FPS, grid: K.grid(CUES.bpm) });
</script>
</body>
</html>
