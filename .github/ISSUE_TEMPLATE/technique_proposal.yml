name: Technique proposal
description: Propose a new atlas entry, transition, material, instrument or template
labels: [atlas, enhancement]
body:
  - type: textarea
    id: what
    attributes: { label: The technique, description: "What does it look/sound like, and when would a motion designer reach for it?" }
    validations: { required: true }
  - type: textarea
    id: ref
    attributes: { label: References, description: "Links to examples (films, shaders, articles). We implement from scratch — do not paste copyrighted code." }
  - type: dropdown
    id: family
    attributes:
      label: Atlas family
      options: [type, three-d, particles, shaders, looks, camera, transitions, light, ui-data, graphic, logos, sound, ideas, editing, color, styles, pipelines, new family]
  - type: checkboxes
    id: pr
    attributes:
      label: Contribution
      options:
        - label: I would like to implement it myself (see CONTRIBUTING.md → "Adding a technique")
