name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm test
      - name: Package the skill
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          (cd skills && zip -qr "../dist/cinewright-skill-${VERSION}.zip" cinewright -x '*/node_modules/*')
          ls -la dist
      - name: Release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 {f=1; next} f && index($0, "## [") == 1 {exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a release made by hand before the tag build (to attach the full-quality films) must not turn this job red
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip --title "cinewright $GITHUB_REF_NAME" --notes-file notes.md
          fi
