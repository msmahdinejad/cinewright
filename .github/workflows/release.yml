name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - name: Package the skill
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          (cd skills && zip -qr "../dist/pure-code-video-skill-${VERSION}.zip" pure-code-video -x '*/node_modules/*')
          ls -la dist
      - name: Release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '$0 ~ "^## \[" v "\]" {f=1; next} f && /^## \[/ {exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "pure-code-video $GITHUB_REF_NAME" --notes-file notes.md
