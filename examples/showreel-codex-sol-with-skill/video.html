//#use math,noise

const LIQUID=gfx.prog(`
//#use math,color,sdf
float field(vec3 point){float clock=uT*.8;float distanceValue=20.;point.xy*=rot(.13*sin(clock));for(int index=0;index<6;index++){float phase=float(index);vec3 center=vec3(sin(clock*(.52+phase*.09)+phase*1.6)*1.30,cos(clock*.68+phase*1.9)*.78,sin(clock*.5+phase)*.50);distanceValue=opSmoothUnion(distanceValue,sdSphere(point-center,.47+.08*sin(clock+phase)),.43);}return distanceValue;}

vec3 environment(vec3 direction){vec3 color=vec3(.016,.026,.055);float stripe=pow(max(cos(direction.y*8.+direction.x*1.9),0.),12.);color+=vec3(.86,.96,1.)*stripe*1.8;float cyan=max(dot(direction,normalize(vec3(-.8,.2,.5))),0.);float violet=max(dot(direction,normalize(vec3(.7,.3,-.4))),0.);color+=vec3(.04,.85,1.)*pow(cyan,5.)*2.1;color+=vec3(.35,.11,.85)*pow(violet,4.)*2.;return color;}

function text(context,copy,x,y,size,options={}){K.text(context,copy,x,y,{size:size*unit,family:DISPLAY,weight:400,fill:PAL.paper,...options});}

function grid(context,time,color='rgba(244,247,255,.045)',spacing=90){context.save();context.strokeStyle=color;context.lineWidth=unit;const drift=(time*12*unit)%(spacing*unit);for(let index=-1;index<=W/(spacing*unit)+1;index++){const position=index*spacing*unit+drift;context.beginPath();context.moveTo(position,0);context.lineTo(position,H);context.stroke();}for(let index=0;index<=H/(spacing*unit)+1;index++){const position=index*spacing*unit;context.beginPath();context.moveTo(0,position);context.lineTo(W,position);context.stroke();}context.restore();}

function build(){

function hook(context,local){

function radial(context,local){

  context.shadowColor='rgba(8,10,18,.22)';context.shadowBlur=36*unit;context.shadowOffsetY=18*unit;context.fillStyle=PAL.ink;K.circle(context,0,0,radius);context.fill();context.shadowBlur=0;context.shadowOffsetY=0;
  for(let ringIndex=0;ringIndex<54;ringIndex++){const fraction=ringIndex/54,scale=.08+.92*fraction,shift=Math.sin(fraction*10-local*2.4)*.12;context.beginPath();for(let pointIndex=0;pointIndex<=180;pointIndex++){const angle=pointIndex/180*K.TAU;const distortion=1+.10*Math.sin(angle*8+fraction*7+local*2)*fraction;const distance=radius*scale*distortion*progress;const px=Math.cos(angle+shift)*distance,py=Math.sin(angle+shift)*distance*.94;if(pointIndex===0)context.moveTo(px,py);else context.lineTo(px,py);}context.strokeStyle=[PAL.cyan,PAL.violet,PAL.paper][ringIndex%3];context.globalAlpha=.35+.55*fraction;context.lineWidth=2.7*unit;context.stroke();}
  context.globalAlpha=1;context.fillStyle=PAL.paper;K.circle(context,0,0,radius*.145);context.fill();text(context,'F',0,0,112,{fill:PAL.ink});context.restore();
  const pop=E.outCubic(seg(local,.05,.5));
  ['ORDER','FROM','CHAOS.'].forEach((copy,index)=>text(context,copy,W*.058,H*(.34+index*.174)+(1-pop)*H*.1,150,{fill:PAL.ink,align:'left',alpha:pop,max:W*.38}));
  frameLabel(context,4,'GENERATIVE SYSTEM',PAL.ink);label(context,'RULES IN. / BEAUTY OUT.',W*.055,H*.916,PAL.ink,'left',21);
}
function motionUI(context,local){
  context.fillStyle=PAL.ink;context.fillRect(0,0,W,H);grid(context,local);K.glow(context,W*.66,H*.40,H*.54,PAL.deep,.25);
  frameLabel(context,5,'INTERACTION / EASING');const entrance=E.outBack(seg(local,-.08,.44));
  ['FEEL','THE','CURVE.'].forEach((copy,index)=>text(context,copy,W*.057,H*(.28+index*.17),156,{alpha:seg(local,.02+index*.07,.36+index*.07),align:'left'}));
  context.save();context.translate(0,(1-entrance)*H*.35);const left=W*.415,top=H*.19,width=W*.53,height=H*.46;
  UI.card(context,left,top,width,height,{radius:22*unit,fill:'#11192c',shadow:24*unit});label(context,'GRAPH EDITOR',left+width*.055,top+height*.115,PAL.paper,'left',23);
  const press=Math.max(0,1-Math.abs(local-1.10)*10);context.save();context.translate(left+width*.86,top+height*.105);context.scale(1-.05*press,1-.05*press);context.shadowColor=PAL.cyan;context.shadowBlur=18*unit;K.rr(context,-width*.08,-height*.06,width*.16,height*.12,height*.06);context.fillStyle=PAL.cyan;context.fill();context.shadowBlur=0;K.text(context,'PLAY',0,0,{size:23*unit,weight:700,family:GROTESK,fill:PAL.ink});context.restore();
  const gx=left+width*.07,gy=top+height*.24,gw=width*.86,gh=height*.61;
  context.strokeStyle='rgba(244,247,255,.08)';context.lineWidth=unit;for(let lineIndex=0;lineIndex<6;lineIndex++){context.beginPath();context.moveTo(gx,gy+gh*lineIndex/5);context.lineTo(gx+gw,gy+gh*lineIndex/5);context.stroke();context.beginPath();context.moveTo(gx+gw*lineIndex/5,gy);context.lineTo(gx+gw*lineIndex/5,gy+gh);context.stroke();}
  const bend=.48+.08*Math.sin(local*2),control1=[gx+gw*.28,gy+gh],control2=[gx+gw*bend,gy];
  context.strokeStyle=K.rgba(PAL.violet,.6);context.lineWidth=2*unit;context.beginPath();context.moveTo(gx,gy+gh);context.lineTo(...control1);context.moveTo(gx+gw,gy);context.lineTo(...control2);context.stroke();
  context.strokeStyle=PAL.cyan;context.lineWidth=7*unit;context.shadowColor=PAL.cyan;context.shadowBlur=15*unit;context.beginPath();context.moveTo(gx,gy+gh);context.bezierCurveTo(...control1,...control2,gx+gw,gy);context.stroke();context.shadowBlur=0;
  [control1,control2].forEach(position=>{context.fillStyle=PAL.violet;K.circle(context,...position,8*unit);context.fill();});
  const progress=clamp((local-.22)/1.42),remaining=1-progress,px=remaining*remaining*remaining*gx+3*remaining*remaining*progress*control1[0]+3*remaining*progress*progress*control2[0]+progress*progress*progress*(gx+gw),py=remaining*remaining*remaining*(gy+gh)+3*remaining*remaining*progress*control1[1]+3*remaining*progress*progress*control2[1]+progress*progress*progress*gy;

  const cursorX=timelineX+W*.13+(timelineW-W*.15)*seg(local,.25,1.76);context.fillStyle=PAL.cyan;context.fillRect(cursorX,timelineY+H*.02,2*unit,H*.123);
  UI.cursor(context,local,[[0,W*.96,H*.64],[.65,W*.77,H*.31],[1.05,W*.88,H*.238,E.inOutCubic,.1],[1.65,W*.84,H*.49]],[1.10],{scale:1.7*unit});

function endCard(context,local){

 },draw:(context,local)=>{frameLabel(context,3,'42,000 PARTICLES / ONE IDEA');strokeCircle(context,W/2,H/2,H*.39,'rgba(34,230,255,.13)',1,local,local+Math.PI*1.7);label(context,'CHAOS → CLARITY',W*.055,H*.916,PAL.cyan,'left',22);}},

 {id:'fluid',at:T.fluid,enter:['liquid',.42],look:{bloom:.24,threshold:.9,grain:.022,ca:.0007,vignette:.18},gl:({rt})=>gfx.pass(LIQUID,{}, {to:rt}),draw:(context,local)=>{

 }},
 {id:'speed',at:T.speed,enter:['zoom',.23],look:{bloom:.28,threshold:.9,grain:.025,ca:.0012,zoomBlur:.055,vignette:.18},gl:({rt},local)=>{
  tunnel.cam.pos=[Math.sin(local*2)*.33,Math.cos(local*1.6)*.24,3-local*22];tunnel.cam.target=[Math.sin(local)*.6,Math.cos(local*1.3)*.3,-20-local*22];tunnel.cam.up=[Math.sin(local*.8)*.20,1,0];gfx.blit(tunnel.render({clear:[.012,.018,.038,1]}),{to:rt});
 },draw:(context,local)=>{frameLabel(context,7,'VELOCITY');const scale=.92+.08*E.outBack(seg(local,-.1,.24));context.save();context.translate(W/2,H/2);context.scale(scale,scale);text(context,'NO',0,-H*.14,196);text(context,'LIMITS',0,H*.105,220,{max:W*.72});context.restore();}},
 {id:'burst',at:T.burst,enter:['flash',.14],look:{bloom:.23,threshold:.95,grain:.026,ca:.0009,vignette:.12},gl:({rt},local,time)=>{fx.bg('rays',{c:[PAL.ink,PAL.deep,PAL.violet,PAL.cyan],speed:.72,amt:.35*Math.exp(-local*2.8)},{to:rt});sparks.draw({t:time,cam:{}},{to:rt});},draw:(context,local)=>{
  const scale=1+.07*Math.exp(-Math.max(0,local)*6);context.save();context.translate(W/2,H/2);context.scale(scale,scale);const entrance=E.outBack(seg(local,-.01,.20));text(context,'BEYOND',0,-H*.16,350*entrance,{max:W*.86});text(context,'THE FRAME',0,H*.155,290*entrance,{fill:PAL.cyan,max:W*.90});context.restore();
  for(let ringIndex=0;ringIndex<3;ringIndex++){const life=local-ringIndex*.09;if(life>0)strokeCircle(context,W/2,H/2,H*(.22+life*.9),K.rgba(PAL.cyan,Math.max(0,.34-life*.32)),3);}
  K.confetti(context,local-.03,W*.10,H*1.05,{n:55,life:1.5,speed:1400*unit,gravity:1600*unit,colors:[PAL.cyan,PAL.violet,PAL.paper],size:12*unit,angle:-1.15,spread:.75,seed:8});
  K.confetti(context,local-.03,W*.90,H*1.05,{n:55,life:1.5,speed:1400*unit,gravity:1600*unit,colors:[PAL.cyan,PAL.violet,PAL.paper],size:12*unit,angle:-1.99,spread:.75,seed:4});frameLabel(context,8,'A NEW DIMENSION');
 }},
 {id:'end',at:T.end,enter:['blur',.30],look:{bloom:.10,threshold:.94,grain:.018,ca:.0006,vignette:.14},draw:endCard}
]);
stage.camera=time=>{const push=time<T.burst?1:time<T.end?1+.07*seg(time,T.burst,T.end):1.035+.045*seg(time,T.end,DUR);return Cine.mix({zoom:push},Cine.punch(time,HITS,{amp:.024,decay:.17}),Cine.shake(time,HITS,{amp:.0028,decay:.17}),Cine.handheld(time,{amp:.0012,speed:.8}));};
stage.look((time,base)=>{const pulse=K.pulse(time,HITS,.055);return {ca:(base.ca??.001)+.0015*pulse,flash:[.010*pulse,.013*pulse,.016*pulse]};});
window.renderFrame=time=>stage.render(time);
window.ready=K.loadFonts(['400 Anton','800 Inter','700 Inter','700 Space Grotesk','500 Space Grotesk','500 JetBrains Mono']).then(()=>{build();return stage.ready();});
K.play(window.renderFrame,{dur:DUR,fps:FPS,grid:K.grid(CUES.bpm)});
