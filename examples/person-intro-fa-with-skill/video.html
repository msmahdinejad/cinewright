<!doctype html>

<body>
<canvas id="out"></canvas>

<!-- THE FILM IS THIS SPEC. Edit the copy, the theme, the scenes and their times; picture (mg.js) and sound (audio.mjs) are both drawn from it.
     Scene types: title · chips · stats · quote · list · fact · chart · logo · cta · words — fields per type: references/motion-graphics.md (skill folder).
     Times in seconds; scenes start on beats (bpm 120 → every 0.5 s). "wipe" = the transition INTO that scene: stripes · circle · slide · flood · blocks · diagonal.
     Item i of a scene appears at  at + (lead ?? .3) + i * (step ?? beat/2). -->
<script id="cues" type="application/json">
{
 "bpm": 120,
 "duration": 15,
 "mood": "upbeat",
 "wipe": "stripes",
 "theme": {
  "preset": "pop"
 },
 "scenes": [
  {
   "type": "title",
   "at": 0,
   "kicker": "سلام، من",
   "lines": [
    "مایا",
    "چن"
   ],
   "sub": "طراح ارشد محصول · تورنتو",
   "avatar": "م",
   "badges": [
    "pen",
    "bolt",
    "star"
   ],
   "bg": "blobs"
  },
  {
   "type": "chips",
   "at": 3,
   "title": "کارهای من",
   "items": [
    {
     "label": "استراتژی محصول",
     "icon": "search",
     "note": "پژوهش · نقشه راه"
    },
    {

    }

  },
  {

   "at": 6,
   "title": "در یک نگاه",
   "items": [
    {
     "value": 8,
     "suffix": "+",

    },
    {
     "value": 120,
     "label": "پروژهٔ تحویل‌شده",
     "icon": "briefcase"
    },
    {
     "value": 14,
     "label": "جایزهٔ طراحی",
     "icon": "trophy"
    }
   ],
   "wipe": "slide"
  },
  {
   "type": "quote",
   "at": 9,
   "text": "طراحی خوب دیده نمی‌شود — تا وقتی که نباشد.",
   "who": "مایا چن",
   "role": "طراح ارشد محصول",
   "wipe": "stripes",
   "flood": "a"
  },
  {
   "type": "cta",
   "at": 11.5,
   "line": "بیایید چیزی عالی بسازیم",
   "handle": "@mayachen",
   "sub": "mayachen.design",
   "button": "سلام بگو",
   "wipe": "flood"
  }
 ]

<script src="lib/kit.js"></script><script src="lib/post.js"></script><script src="lib/mg.js"></script>
<script>
'use strict';
/* A motion-graphics film from data: MG.film() schedules the scenes, camera and wipes; this file only boots it and applies the finishing grade.
   Need something the kit does not have? Register a scene:  MG.scenes.mine = (g, lt, t, sc, X) => { … 2D drawing; X = { W, H, U (unit = H/1080), V (vertical), T (theme), B (beat) } … };  then  { "type": "mine" }  in the spec. */
const SPEC = JSON.parse(document.getElementById('cues').textContent); SPEC.lang = SPEC.lang || document.documentElement.lang;
const Q = K.params(), W = Q.w || SPEC.w || 1920, H = Q.h || SPEC.h || 1080, FPS = Q.fps || 30, DUR = SPEC.duration, { E } = K;
window.VIDEO = { width: W, height: H, fps: FPS, duration: DUR, title: 'mg_fa', audio: 'audio.wav', markers: SPEC.scenes.map((s, i) => ({ t: s.at ?? 0, label: (i + 1) + ' ' + s.type })) };

const out = document.getElementById('out'); out.width = W; out.height = H;
const scene = K.canvas(W, H), g = scene.getContext('2d'), post = new Post(out), film = MG.film(SPEC, { W, H });

function renderFrame(t) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.shadowBlur = 0; g.setLineDash([]);
  film.draw(g, t);
  post.render(scene, { frame: K.frameIndex(t, FPS), bloom: film.T.light ? .12 : .22, threshold: .8, ca: .0012, grain: .028, vignette: film.T.light ? .14 : .32, fade: K.seg(t, DUR - .4, DUR - .02, E.inCubic) });
}
window.renderFrame = renderFrame;
window.ready = K.loadFonts(['700 Space Grotesk', '400 Anton', '600 Fredoka', '700 Playfair Display', '500 Inter', '600 Inter', '700 Inter', '800 Inter', '500 JetBrains Mono', '700 JetBrains Mono', '700 Vazirmatn']).then(() => true);
K.play(renderFrame, { dur: DUR, fps: FPS, grid: K.grid(SPEC.bpm || 120) });
</script>
</body>
</html>
